name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  smoke:
    name: Server boots and serves the client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The test suite exercises the server in-process, which cannot catch the
      # one thing this does: that the built entry point finds the built client
      # on disk and hands a browser a page that boots.
      - name: Boot and play one turn over HTTP
        run: |
          node packages/server/dist/main.js &
          server=$!
          trap 'kill $server' EXIT

          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8787/ > /dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://localhost:8787/ | grep -q 'World Wide War'
          curl -fsS http://localhost:8787/main.js | grep -q 'app.js'
          curl -fsS http://localhost:8787/style.css > /dev/null

          game=$(curl -fsS -X POST http://localhost:8787/api/games \
            -H 'content-type: application/json' \
            -d '{"name":"CI","playerCount":4,"humanSeats":1,"turnSeconds":60,"seed":"ci"}')
          code=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).code)" "$game")
          token=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).token)" "$game")

          view=$(curl -fsS -X POST "http://localhost:8787/api/games/$code/orders" \
            -H 'content-type: application/json' \
            -d "{\"token\":\"$token\",\"locked\":true,\"orders\":{\"pledge\":1,\"deploys\":[],\"units\":[]}}")
          node -e "
            const view = JSON.parse(process.argv[1]);
            if (view.turn !== 2) throw new Error('turn did not resolve: ' + view.turn);
            if (!view.report) throw new Error('no turn report');
            console.log('resolved turn 1:', view.report.headline);
          " "$view"

  mapgen:
    name: Map generator sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The exhaustive sweep the default test run only samples: every player
      # count against many seeds, asserting connectivity, degree bounds, region
      # contiguity, and — the one that matters — that the graph is invariant
      # under a one-wedge rotation. Seat fairness is structural, so this is
      # where a change that quietly breaks it gets caught.
      # `pnpm test -- <path>` does not filter — pnpm forwards the `--` and vitest
      # runs the whole suite anyway. Invoke vitest directly so this job actually
      # sweeps the generator instead of quietly re-running everything.
      - name: Sweep 300 seeds per player count
        run: pnpm exec vitest run packages/engine/src/mapgen
        env:
          MAPGEN_SEEDS: '300'

  balance:
    name: Balance and social gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The harness imports @www/engine through the workspace link, which
      # resolves to the package's compiled dist. Only the check job happens to
      # build as a side effect of typechecking, so this job must build
      # explicitly or it cannot resolve the engine at all.
      - run: pnpm build

      # Seat fairness and game length say whether it is a fair, fast game;
      # betrayal rate and shared-win rate say whether the social layer has any
      # teeth. `pnpm sim` exits non-zero when a gate fails, so a tuning change
      # that quietly guts the pact cannot merge.
      - name: Play 800 games per table size
        run: pnpm exec tsx tools/simulate/src/main.ts --games 800 --players 2,4,6,8,12
