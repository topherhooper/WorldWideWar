name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Which of the jobs below a changeset can plausibly break. A cached install to
  # gate up to twenty minutes of sweeps; a separate job rather than an output of
  # `check`, because making the sweeps wait on the server suite would trade the
  # saving straight back for latency.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.select.outputs.test }}
      serverTest: ${{ steps.select.outputs.serverTest }}
      mapgen: ${{ steps.select.outputs.mapgen }}
      balance: ${{ steps.select.outputs.balance }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier diffs against a base commit, which a shallow clone
          # does not have. Without this it fails open and runs everything.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: select
        run: pnpm exec tsx tools/ci/src/main.ts "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}

  check:
    name: Typecheck, lint and test
    needs: changes
    # Every guard below reads `!= 'false'`, not `== 'true'`, and every job that
    # needs `changes` runs even when it did not succeed. A broken classifier must
    # over-test, never turn three required checks into three green skips.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # `format:check`, `lint` and `typecheck` above stay unconditional — Prettier
      # formats Markdown too, and misformatted docs are a failure this repo has
      # actually shipped.
      - if: needs.changes.outputs.test != 'false'
        run: pnpm test

      # Integration tests against the Firestore + Auth emulators. Serialized:
      # the suites share one emulator and each wipes it between tests.
      # firebase-tools 15 requires Java 21+; the runner's default is 17.
      - uses: actions/setup-java@v4
        if: needs.changes.outputs.serverTest != 'false'
        with:
          distribution: temurin
          java-version: '21'
      - name: Server integration tests
        if: needs.changes.outputs.serverTest != 'false'
        run: pnpm test:server

  mapgen:
    name: Map generator sweep
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mapgen != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The exhaustive sweep the default test run only samples: every player
      # count against many seeds, asserting connectivity, degree bounds, region
      # contiguity, and — the one that matters — that the graph is invariant
      # under a one-wedge rotation. Seat fairness is structural, so this is
      # where a change that quietly breaks it gets caught.
      # `pnpm test -- <path>` does not filter — pnpm forwards the `--` and vitest
      # runs the whole suite anyway. Invoke vitest directly so this job actually
      # sweeps the generator instead of quietly re-running everything.
      - name: Sweep 300 seeds per player count
        run: pnpm exec vitest run packages/engine/src/mapgen
        env:
          MAPGEN_SEEDS: '300'

  balance:
    name: Balance and social gates
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.balance != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The harness imports @www/engine through the workspace link, which
      # resolves to the package's compiled dist. Only the check job happens to
      # build as a side effect of typechecking, so this job must build
      # explicitly or it cannot resolve the engine at all.
      - run: pnpm build

      # Seat fairness and game length say whether it is a fair, fast game;
      # betrayal rate and shared-win rate say whether the social layer has any
      # teeth. `pnpm sim` exits non-zero when a gate fails, so a tuning change
      # that quietly guts the pact cannot merge.
      - name: Play 800 games per table size
        run: pnpm exec tsx tools/simulate/src/main.ts --games 800 --players 2,4,6,8,12
