# Test deploy: the server image as a tagged, zero-traffic Cloud Run revision.
# No hosting step; see docs/deployment.md, "The test host".
steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA

  - id: deploy-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - www-api
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA
      - --region=us-central1
      # A tagged revision that takes no traffic: the live (or mothballed) revision is
      # untouched, and the tag URL is what the test site's /api rewrite points at.
      - --no-traffic
      - --tag=$_TAG
      # --update-env-vars merges from the latest revision, so this revision carries the
      # test BASE_URL. cloudbuild.yaml sets BASE_URL on every production deploy; keep it.
      - --update-env-vars=PUSH_TRANSPORT=fcm,BASE_URL=$_BASE_URL

substitutions:
  _TAG: preview
  _BASE_URL: https://test.topherhooper.com

# The default 10 minutes is not enough on the default machine type, and a build that
# times out costs the same minutes as one that finishes.
timeout: 1800s

options:
  # CLOUD_LOGGING_ONLY is required for --service-account and must stay.
  #
  # No machineType here, deliberately. Cloud Build's 2,500 free build-minutes a month
  # apply to e2-standard-2 in the default pool and to nothing else — naming any other
  # machine type forfeits the free tier for every build, from the first minute. This
  # config asked for E2_HIGHCPU_8, so each push to main was billed at the highcpu rate
  # while 2,500 free minutes went unused. Builds get slower; they stop costing money.
  logging: CLOUD_LOGGING_ONLY
