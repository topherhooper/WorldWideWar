# Deploy pipeline: push to main → server image → Cloud Run → web bundle → Hosting.
# CI (checks, sweeps, balance gates) stays in GitHub Actions.
steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA

  - id: deploy-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - www-api
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA
      - --region=us-central1
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --set-secrets=RESEND_API_KEY=resend-api-key:latest,UNSUBSCRIBE_SECRET=unsubscribe-secret:latest
      # BASE_URL builds every link inside outgoing mail, so it must be the
      # public hostname, not the .web.app one — a mismatch between sender
      # domain and link domain is what spam filters score against.
      # TICK_AUDIENCE is set once out-of-band (the run URL only exists after the
      # first deploy); --update-env-vars merges and will not clobber it.
      # SESSION_COOKIE_DOMAIN scopes the shared sign-in cookie to every topherhooper.com
      # site (packages/server/src/session.ts; docs/deployment.md "Shared sign-in").
      - --update-env-vars=GCP_PROJECT=$PROJECT_ID,BASE_URL=$_BASE_URL,TICK_SERVICE_ACCOUNT=www-tick@$PROJECT_ID.iam.gserviceaccount.com,SESSION_COOKIE_DOMAIN=topherhooper.com
      # Alerts are off: with no MAIL_FROM the server falls back to LogMailer, and
      # with no PUSH_TRANSPORT to LogPusher (packages/server/src/main.ts), so turn,
      # game-over and reminder notices are logged instead of sent. Because
      # --update-env-vars merges, leaving the two out is not enough; the removal has
      # to be explicit or the previous revision's values carry over. To turn alerts
      # back on, delete this line and put these back on the line above:
      #   MAIL_FROM=World Wide War <noreply@mail.topherhooper.com>  (a Resend-verified domain)
      #   PUSH_TRANSPORT=fcm
      - --remove-env-vars=MAIL_FROM,PUSH_TRANSPORT

  # Without this the revision just deployed can sit at 0% forever. The test host
  # deploys with --no-traffic (cloudbuild.preview.yaml), and the first such deploy
  # pins production traffic to whichever revision was serving at the time. From then
  # on `gcloud run deploy` creates revisions and routes nothing to them, and still
  # exits 0. Tags are left alone, so the test host's `preview` tag stays where it is.
  - id: route-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - www-api
      - --to-latest
      - --region=us-central1

  - id: deploy-hosting
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable pnpm
        pnpm install --frozen-lockfile
        pnpm exec tsc --build
        pnpm --filter @www/web build
        pnpm exec firebase deploy --only hosting --project $PROJECT_ID --non-interactive

substitutions:
  # Overridable so a deploy can fall back to the .web.app hostname while a new
  # custom domain's TLS certificate is still provisioning — mail sent in that
  # window would otherwise carry links that fail to connect.
  _BASE_URL: https://play.topherhooper.com

# The default 10 minutes is not enough on the default machine type, and a build that
# times out costs the same minutes as one that finishes.
timeout: 1800s

options:
  # CLOUD_LOGGING_ONLY is required for --service-account and must stay.
  #
  # No machineType here, deliberately. Cloud Build's 2,500 free build-minutes a month
  # apply to e2-standard-2 in the default pool and to nothing else — naming any other
  # machine type forfeits the free tier for every build, from the first minute. This
  # config asked for E2_HIGHCPU_8, so each push to main was billed at the highcpu rate
  # while 2,500 free minutes went unused. Builds get slower; they stop costing money.
  logging: CLOUD_LOGGING_ONLY
