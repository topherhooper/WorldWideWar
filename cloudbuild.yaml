# Deploy pipeline: push to main → server image → Cloud Run → web bundle → Hosting.
# CI (checks, sweeps, balance gates) stays in GitHub Actions.
steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA

  - id: deploy-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - www-api
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/www/api:$COMMIT_SHA
      - --region=us-central1
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --set-secrets=RESEND_API_KEY=resend-api-key:latest,UNSUBSCRIBE_SECRET=unsubscribe-secret:latest
      # BASE_URL builds every link inside outgoing mail, so it must be the
      # public hostname, not the .web.app one — a mismatch between sender
      # domain and link domain is what spam filters score against.
      # MAIL_FROM must stay on a Resend-verified domain (mail.topherhooper.com).
      # TICK_AUDIENCE is set once out-of-band (the run URL only exists after the
      # first deploy); --update-env-vars merges and will not clobber it.
      - --update-env-vars=GCP_PROJECT=$PROJECT_ID,BASE_URL=$_BASE_URL,TICK_SERVICE_ACCOUNT=www-tick@$PROJECT_ID.iam.gserviceaccount.com,MAIL_FROM=World Wide War <noreply@mail.topherhooper.com>

  - id: build-party
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/party:$COMMIT_SHA
      - prototypes/dinner-party

  - id: push-party
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/www/party:$COMMIT_SHA

  - id: deploy-party
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - www-party
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/www/party:$COMMIT_SHA
      - --region=us-central1
      - --allow-unauthenticated
      - --min-instances=0
      # Rooms live in the instance's memory, so every guest at one party has to land on
      # the same container. max-instances=1 is load-bearing here rather than a cost
      # control: raise it and half the table joins a room the other half cannot see. The
      # client polls every two seconds, which keeps the instance warm for as long as one
      # phone is open; a deploy mid-party still drops every room, which is the price of
      # publishing a prototype.
      - --max-instances=1
      - --set-env-vars=BASE_PATH=/party

  - id: deploy-hosting
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable pnpm
        pnpm install --frozen-lockfile
        pnpm exec tsc --build
        pnpm --filter @www/web build
        pnpm exec firebase deploy --only hosting --project $PROJECT_ID --non-interactive

substitutions:
  # Overridable so a deploy can fall back to the .web.app hostname while a new
  # custom domain's TLS certificate is still provisioning — mail sent in that
  # window would otherwise carry links that fail to connect.
  _BASE_URL: https://play.topherhooper.com

# The default 10 minutes is not enough on the default machine type, and a build that
# times out costs the same minutes as one that finishes.
timeout: 1800s

options:
  # CLOUD_LOGGING_ONLY is required for --service-account and must stay.
  #
  # No machineType here, deliberately. Cloud Build's 2,500 free build-minutes a month
  # apply to e2-standard-2 in the default pool and to nothing else — naming any other
  # machine type forfeits the free tier for every build, from the first minute. This
  # config asked for E2_HIGHCPU_8, so each push to main was billed at the highcpu rate
  # while 2,500 free minutes went unused. Builds get slower; they stop costing money.
  logging: CLOUD_LOGGING_ONLY
